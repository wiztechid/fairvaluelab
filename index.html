lass=suggestCode>'+v.ticker+'</span><span class=suggestName>'+suggestEsc(v.name)+' · '+suggestEsc(v.sector)+'</span></div>'}).join(''):'<div class=suggestEmpty>Tidak ditemukan di universe DES.</div>';suggestBoxEl.classList.add('open')}function chooseSuggest(t){tickerEl.value=t;suggestBoxEl.classList.remove('open');go(t)}tickerEl.addEventListener('input',async function(){if(!SEARCH_STOCKS.length)await initSuggest();renderSuggest()});tickerEl.addEventListener('focus',async function(){if(!SEARCH_STOCKS.length)await initSuggest();if(tickerEl.value.trim())renderSuggest()});suggestBoxEl.addEventListener('pointerdown',function(e){let el=e.target.closest('.suggestItem');if(el){e.preventDefault();chooseSuggest(el.dataset.ticker)}});document.addEventListener('pointerdown',function(e){if(!e.target.closest('.search'))suggestBoxEl.classList.remove('open')});tickerEl.addEventListener('keydown',function(e){let items=Array.from(suggestBoxEl.querySelectorAll('.suggestItem'));if(e.key==='ArrowDown'&&items.length){e.preventDefault();suggestIndex=Math.min(suggestIndex+1,items.length-1)}else if(e.key==='ArrowUp'&&items.length){e.preventDefault();suggestIndex=Math.max(suggestIndex-1,0)}else if(e.key==='Escape'){suggestBoxEl.classList.remove('open');return}else if(e.key==='Enter'){e.preventDefault();if(suggestIndex>=0&&items[suggestIndex])chooseSuggest(items[suggestIndex].dataset.ticker);else go(tickerEl.value)}items.forEach(function(x,i){x.classList.toggle('active',i===suggestIndex)})});analyzeBtn.addEventListener('click',function(){go(tickerEl.value)});initSuggest();window.addEventListener('popstate',()=>{let q=clean(new URLSearchParams(location.search).get('ticker'));if(q)go(q)});tickerEl.value=firstTicker();go(tickerEl.value);</script></body></html>
