<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WISS Fair Value Lab</title><style>:root{--card:#0e1a2b;--line:#22334a;--txt:#edf4ff;--muted:#91a4bd;--accent:#50d6a0;--bad:#ff7b86}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#07101d,#0a1830);color:var(--txt);font-family:Inter,system-ui,Arial}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand h1{margin:0;font-size:25px}.brand p{margin:5px 0;color:var(--muted)}.search{display:flex;gap:8px}.search input{width:210px;background:#091423;border:1px solid var(--line);color:white;padding:13px 14px;border-radius:12px;font-size:16px;text-transform:uppercase}button{border:0;border-radius:12px;padding:13px 18px;background:var(--accent);font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px;margin-top:18px}.card{background:rgba(14,26,43,.94);border:1px solid var(--line);border-radius:16px;padding:17px}.hero,.full{grid-column:span 12}.kpi{grid-column:span 3}.half{grid-column:span 6}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.big{font-size:31px;font-weight:850;margin-top:5px}.green{color:var(--accent)}.red{color:var(--bad)}.fvbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.fvbar div,.raw div{background:#091423;border-radius:12px;padding:12px}table{width:100%;border-collapse:collapse;margin-top:8px}th,td{text-align:right;padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px}th:first-child,td:first-child{text-align:left}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#14243a;font-size:12px}.meter{height:9px;background:#091423;border-radius:99px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;background:var(--accent)}.raw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.raw b{display:block;margin-top:4px}.small{font-size:12px;color:var(--muted)}.error{margin-top:15px;color:var(--bad)}@media(max-width:760px){.kpi,.half{grid-column:span 12}.raw{grid-template-columns:repeat(2,1fr)}.fvbar{grid-template-columns:1fr}.big{font-size:26px}}</style></head><body><div class="wrap"><div class="top"><div class="brand"><h1>🔥 WISS Fair Value Lab</h1><p>Quarterly fundamentals × fair value models × latest market price</p></div><div class="search"><input id="ticker" value="TOTL" placeholder="Ticker IDX"><button onclick="go()">ANALYZE</button></div></div><div id="err" class="error"></div><div id="app" class="grid"></div></div><script>const rup=v=>v==null?'—':new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(v);const pct=v=>v==null?'—':(v*100).toFixed(1)+'%';const num=v=>v==null?'—':new Intl.NumberFormat('id-ID',{maximumFractionDigits:2,notation:'compact'}).format(v);const cls=v=>v>=0?'green':'red';async function go(){let q=ticker.value.trim().toUpperCase();err.textContent='';app.innerHTML='<div class="card full">Membaca hasil valuasi terakhir…</div>';try{let r=await fetch('data/'+encodeURIComponent(q)+'.json?ts='+Date.now()),d=await r.json();if(!r.ok)throw Error('Ticker belum tersedia dalam universe Fair Value Lab');render(d)}catch(e){app.innerHTML='';err.textContent=e.message+' — data diperbarui otomatis oleh GitHub Actions.'}}function render(d){let f=d.fairValue,t=d.technical||{},raw=d.raw||{};let methods=d.methods.map(m=>`<tr><td>${m.name}${m.included?'':' <span class=small>(excluded)</span>'}</td><td>${rup(m.bear)}</td><td>${rup(m.base)}</td><td>${rup(m.bull)}</td><td class="${cls(m.upside)}">${pct(m.upside)}</td></tr>`).join('');let raws=Object.entries(raw).map(([k,v])=>`<div><span class=small>${k}</span><b>${typeof v==='number'?num(v):v??'—'}</b></div>`).join('');app.innerHTML=`<div class="card hero"><div class=label>${d.ticker} · ${d.name}</div><div class=big>${rup(d.price)}</div><span class=badge>${f.label}</span><div class=fvbar><div><span class=label>Bear FV</span><b>${rup(f.bear)}</b></div><div><span class=label>Base FV</span><b class=green>${rup(f.base)}</b></div><div><span class=label>Bull FV</span><b>${rup(f.bull)}</b></div></div></div><div class="card kpi"><div class=label>Upside / downside</div><div class="big ${cls(f.upside)}">${pct(f.upside)}</div></div><div class="card kpi"><div class=label>Model confidence</div><div class=big>${f.confidence}/100</div><div class=meter><i style="width:${f.confidence}%"></i></div></div><div class="card kpi"><div class=label>Normalized growth</div><div class=big>${pct(raw.growthNormalized)}</div></div><div class="card kpi"><div class=label>Model dispersion</div><div class=big>${pct(f.dispersion)}</div></div><div class="card full"><div class=label>Valuation matrix</div><table><thead><tr><th>Method</th><th>Bear</th><th>Base</th><th>Bull</th><th>Upside</th></tr></thead><tbody>${methods}</tbody></table></div><div class="card half"><div class=label>Technical context</div><table><tr><td>MA20</td><td>${rup(t.ma20)}</td></tr><tr><td>MA50</td><td>${rup(t.ma50)}</td></tr><tr><td>MA200</td><td>${rup(t.ma200)}</td></tr><tr><td>RSI 14</td><td>${t.rsi14?.toFixed(1)??'—'}</td></tr><tr><td>Return 1M</td><td>${pct(t.return1m)}</td></tr><tr><td>Return 3M</td><td>${pct(t.return3m)}</td></tr></table></div><div class="card half"><div class=label>Raw data / assumptions</div><div class=raw>${raws}</div></div><div class="card full small">Data generated ${new Date(d.asOf).toLocaleString('id-ID')} · ${d.source}. Fair value adalah estimasi model; laporan kuartalan mengubah fundamental, sedangkan refresh harga memperbarui upside/downside.</div>`}go();</script></body></html>
