<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WISS Fair Value</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fb;color:#162033;font-family:Inter,system-ui,Arial}.nav{background:#fff;border-bottom:1px solid #e5eaf1;position:sticky;top:0;z-index:8}.navin{max-width:1200px;margin:auto;padding:14px 22px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:900}.logo i{font-style:normal;color:#08a982}.search{display:flex;gap:8px}.search input{width:180px;padding:11px 14px;border:1px solid #dce3ed;border-radius:10px;font-weight:800;text-transform:uppercase}.search button,.fv{border:0;cursor:pointer}.search button{background:#08a982;color:#fff;padding:11px 17px;border-radius:10px;font-weight:800}.wrap{max-width:1200px;margin:auto;padding:22px}.tickerhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}.symbol{font-size:29px;font-weight:900}.muted,.updated,.hint,.note{color:#8a96a7;font-size:12px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;align-items:stretch}.card{background:#fff;border:1px solid #e5eaf1;border-radius:14px;padding:18px;box-shadow:0 4px 18px #1c2b4610}.price{grid-column:span 4;color:#fff;min-height:290px}.price.discount{background:linear-gradient(135deg,#078b66,#19bf91)}.price.fairprice{background:linear-gradient(135deg,#c78b0c,#efbd3b)}.price.expensive{background:linear-gradient(135deg,#cf4052,#ef6877)}.fair{grid-column:span 8;display:flex;flex-direction:column}.kpi{grid-column:span 3}.full{grid-column:span 12}.half{grid-column:span 6}.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:#8491a4}.price .lbl{color:#ffffffcc}.pricebig{font-size:42px;font-weight:900;margin:8px 0}.pill,.chip{display:inline-flex;border-radius:8px;font-size:11px;font-weight:800}.pill{padding:5px 9px;background:#fff;color:#48566b;margin-top:10px}.profilebox{margin-top:24px;padding-top:15px;border-top:1px solid #ffffff45}.profilebox b{display:block;font-size:14px;margin:4px 0}.profilebox small{display:block;color:#ffffffd0;line-height:1.45}.fvrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.fv{padding:13px;background:#f6f8fb;border:1px solid transparent;border-radius:11px;text-align:left;color:#172033}.fv b{display:block;font-size:21px;margin-top:5px}.fv.active{border-color:#08a982;box-shadow:0 0 0 2px #08a98220;background:#e8fbf5}.section{font-size:14px;font-weight:900;margin-bottom:7px}.big{font-size:27px;font-weight:900;margin-top:7px}.pos{color:#07946f}.neg{color:#e44e61}.amber{color:#ce8c09}.zoneword{font-size:23px;font-weight:900;margin-top:7px}.band{height:9px;border-radius:10px;background:linear-gradient(90deg,#39c69e 0 35%,#f2c94c 35% 65%,#ef6b75 65%);position:relative;margin:17px 3px 7px}.pin{position:absolute;width:3px;height:17px;background:#172033;top:-4px}.bandlabels{display:flex;justify-content:space-between;font-size:10px;color:#8b97a7}.quick{margin-top:auto;padding-top:16px;border-top:1px solid #edf0f4}.quicktitle{font-size:10px;color:#8491a4;text-transform:uppercase;letter-spacing:.08em;font-weight:900;margin-bottom:9px}.quickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quickitem{background:#f6f8fb;border-radius:9px;padding:10px}.quickitem span{display:block;font-size:9px;color:#8995a7;text-transform:uppercase;font-weight:800}.quickitem b{display:block;font-size:13px;margin-top:4px}.mos{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.chip{padding:7px 10px;background:#f4f7fb;color:#425067;gap:5px;align-items:center}.chip strong{margin-left:0}.sectorbanner{background:#effaf7;border:1px solid #cceee4;padding:12px 14px;border-radius:10px;margin-bottom:13px}.sectorbanner b{color:#087c61}.sectorbanner div{font-size:11px;color:#617082;margin-top:4px}.info{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;border:1px solid #cbd4df;color:#647287;background:#fff;font-size:11px;font-weight:900;cursor:pointer;margin-left:6px;vertical-align:middle}table{width:100%;border-collapse:collapse}th,td{padding:12px 8px;border-bottom:1px solid #edf0f4;text-align:right;font-size:13px}th{font-size:10px;color:#8491a4;text-transform:uppercase}th:first-child,td:first-child{text-align:left}.method{font-weight:800}.warn{display:block;color:#c88400;font-size:10px;margin-top:3px}.raw{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.raw div{background:#f6f8fb;padding:11px;border-radius:9px}.raw span{display:block;color:#8995a7;font-size:10px}.raw b{display:block;margin-top:4px}.meter{height:6px;background:#edf1f5;border-radius:8px;margin-top:10px}.meter i{display:block;height:100%;background:#08a982}.modalbg{position:fixed;inset:0;background:#0e1726aa;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modalbg.show{display:flex}.modal{background:#fff;max-width:520px;width:100%;border-radius:16px;padding:21px;box-shadow:0 20px 70px #0003}.modalhead{display:flex;justify-content:space-between;gap:15px;align-items:center}.modal h3{margin:0}.close{border:0;background:#eef2f6;border-radius:8px;padding:7px 10px;cursor:pointer}.modal p{color:#58677b;line-height:1.55;font-size:13px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.facts div{background:#f5f7fa;border-radius:9px;padding:10px;font-size:11px}.facts b{display:block;margin-top:3px}.error{color:#e44e61}.footer{font-size:10px;color:#8a96a7}@media(max-width:760px){.navin,.wrap{padding:14px}.logo{font-size:17px}.search input{width:115px}.price,.fair,.kpi,.half{grid-column:span 12}.price{min-height:0}.tickerhead{align-items:start;flex-direction:column;gap:7px}.fv b{font-size:16px}.fv{padding:10px}.raw{grid-template-columns:repeat(2,1fr)}.quickgrid{grid-template-columns:repeat(2,1fr)}table{display:block;overflow-x:auto;white-space:nowrap}.facts{grid-template-columns:1fr}}</style></head><body><div class=nav><div class=navin><div class=logo>WISS <i>FAIR VALUE</i></div><div class=search><input id=ticker value="TOTL" placeholder="Kode saham"><button onclick="go()">Analisa</button></div></div></div><main class=wrap><div id=err class=error></div><div id=head></div><div id=app class=grid></div></main><div id=modalbg class=modalbg onclick="if(event.target===this)closeInfo()"><div class=modal><div class=modalhead><h3 id=mtitle></h3><button class=close onclick="closeInfo()">✕</button></div><p id=mbody></p><div id=mfacts class=facts></div></div></div><script>const rup=v=>v==null?'—':new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(v),pct=v=>v==null?'—':(v*100).toFixed(1)+'%',num=v=>v==null?'—':new Intl.NumberFormat('id-ID',{maximumFractionDigits:2,notation:'compact'}).format(v),cl=v=>v>=0?'pos':'neg';let D=null,scenario='base';async function go(){let q=ticker.value.trim().toUpperCase();err.textContent='';try{let x=await fetch('data/'+q+'.json?x='+Date.now());if(!x.ok)throw Error('Kode saham belum tersedia pada universe saat ini');D=await x.json();scenario='base';render()}catch(e){app.innerHTML='';err.textContent=e.message}}function smet(x){let fv=D.fairValue[x],p=D.price,prem=p/fv-1,zone=prem<=-.10?'discount':prem>=.10?'expensive':'fairprice';return{fv,potential:fv/p-1,premium:prem,zone,status:zone==='discount'?'MURAH':zone==='expensive'?'MAHAL':'WAJAR'}}function choose(x){scenario=x;render()}function openInfo(i){let m=D.methods[i],dc=D.dcfDiagnostics||{};mtitle.textContent=m.name;mbody.textContent=m.explanation||'Metode valuasi pembanding.';let f=[['Bobot ke hasil akhir',m.included?pct(m.normalizedWeight):'Tidak dipakai'],['Relevansi sektor',Math.round((m.relevance||0)*100)+'%']];if(m.name==='DCF')f.push(['Asumsi pertumbuhan',pct(dc.growth)],['Cost of Equity',pct(dc.costOfEquity)],['Terminal Growth',pct(dc.terminalGrowth)],['Porsi Terminal Value',pct(dc.terminalValueShare)]);mfacts.innerHTML=f.map(x=>`<div>${x[0]}<b>${x[1]}</b></div>`).join('');modalbg.classList.add('show')}function closeInfo(){modalbg.classList.remove('show')}function render(){let d=D,f=d.fairValue,t=d.technical||{},r=d.raw||{},q=d.quality||{},p=d.companyProfile||{},s=smet(scenario),sn=scenario==='bear'?'Konservatif':scenario==='bull'?'Optimistis':'Harga Wajar',agree=f.agreement==='HIGH'?'TINGGI':f.agreement==='MEDIUM'?'SEDANG':'RENDAH',pin=Math.max(2,Math.min(98,50+s.premium*70)),qs=q.dataScore||0,trend=t.ma50?(d.price/t.ma50-1):null,trendText=trend==null?'—':trend>=0?'Di atas MA50':'Di bawah MA50';head.innerHTML=`<div class=tickerhead><div><div class=symbol>${d.ticker.replace('.JK','')}</div><div class=muted>${d.name}</div></div><div class=updated>Diperbarui ${new Date(d.asOf).toLocaleString('id-ID')} · Yahoo Finance</div></div>`;let rows=d.methods.map((m,i)=>`<tr><td><span class=method>${m.name}</span><button class=info onclick="openInfo(${i})">i</button>${m.warning?`<span class=warn>⚠ ${m.warning}</span>`:''}</td><td>${rup(m.bear)}</td><td><b>${rup(m.base)}</b></td><td>${rup(m.bull)}</td><td class=${cl(m[scenario]/d.price-1)}>${pct(m[scenario]/d.price-1)}</td><td>${m.included?pct(m.normalizedWeight):'—'}</td></tr>`).join('');app.innerHTML=`<section class="card price ${s.zone}"><div class=lbl>Harga Sekarang · ${sn}</div><div class=pricebig>${rup(d.price)}</div><div>Patokan terpilih ${rup(s.fv)}</div><div class=pill>${s.status}</div><div class=profilebox><span class=lbl>Profil Valuasi</span><b>${p.sector||'Umum'}</b><small>${p.industry||p.sourceSector||'Klasifikasi sektor belum tersedia'}</small><small style="margin-top:8px">Model otomatis menyesuaikan bobot metode dengan karakter sektor.</small></div></section><section class="card fair"><div class=section>Estimasi Harga Wajar</div><div class=hint>Pilih skenario. Potensi, status harga, dan warna kartu akan ikut berubah.</div><div class=fvrow><button class="fv ${scenario==='bear'?'active':''}" onclick="choose('bear')"><span class=lbl>Konservatif</span><b>${rup(f.bear)}</b></button><button class="fv ${scenario==='base'?'active':''}" onclick="choose('base')"><span class=lbl>Harga Wajar</span><b>${rup(f.base)}</b></button><button class="fv ${scenario==='bull'?'active':''}" onclick="choose('bull')"><span class=lbl>Optimistis</span><b>${rup(f.bull)}</b></button></div><div class=band><i class=pin style="left:${pin}%"></i></div><div class=bandlabels><span>Murah</span><span>Wajar</span><span>Mahal</span></div><div class=quick><div class=quicktitle>Ringkasan Cepat</div><div class=quickgrid><div class=quickitem><span>Tren vs MA50</span><b class=${cl(trend)}>${trendText} ${trend==null?'':pct(trend)}</b></div><div class=quickitem><span>P/E Sekarang</span><b>${r.currentPE?.toFixed(2)||'—'}×</b></div><div class=quickitem><span>ROE</span><b>${pct(r.roe)}</b></div><div class=quickitem><span>FCF / Laba Bersih</span><b>${pct(q.cashConversion)}</b></div></div></div></section><section class="card kpi"><div class=lbl>Potensi ke ${sn}</div><div class="big ${cl(s.potential)}">${pct(s.potential)}</div><div class=note>${rup(d.price)} → ${rup(s.fv)}</div></section><section class="card kpi"><div class=lbl>Status Harga</div><div class="zoneword ${s.zone==='discount'?'pos':s.zone==='expensive'?'neg':'amber'}">${s.status}</div><div class=note>${s.status==='MURAH'?'≥10% di bawah patokan':s.status==='MAHAL'?'≥10% di atas patokan':'Dalam ±10% patokan'}</div></section><section class="card kpi"><div class=lbl>Kecocokan Metode</div><div class=big>${agree}</div><div class=note>Selisih hasil ${pct(f.dispersion)}</div></section><section class="card kpi"><div class=lbl>Kelengkapan Data</div><div class="big ${qs>=80?'pos':qs>=60?'amber':'neg'}">${q.dataLabel||'—'}</div><div class=note>${q.availableInputs||'—'}/${q.totalInputs||10} data utama tersedia</div><div class=meter><i style="width:${qs}%"></i></div></section><section class="card full"><div class=section>Model Valuasi Sesuai Sektor</div><div class=sectorbanner><b>${p.sector||'Umum'} · ${p.industry||p.sourceSector||''}</b><div>${p.sectorNote||'Bobot model disesuaikan dengan karakter bisnis.'}</div></div><table><thead><tr><th>Metode</th><th>Konservatif</th><th>Harga Wajar</th><th>Optimistis</th><th>Potensi</th><th>Bobot Final</th></tr></thead><tbody>${rows}</tbody></table><div class=note style="margin-top:10px">ⓘ Tekan ikon info pada setiap metode untuk melihat logika, relevansi sektor, bobot, dan asumsi khusus.</div></section><section class="card full"><div class=section>Area Harga Aman · ${sn}</div><div class=mos><span class=chip>Patokan <strong>${rup(s.fv)}</strong></span><span class=chip>Diskon 20% <strong>${rup(s.fv*.8)}</strong></span><span class=chip>Diskon 30% <strong>${rup(s.fv*.7)}</strong></span><span class=chip>Harga sekarang <strong>${rup(d.price)}</strong></span></div></section><section class="card half"><div class=section>Kondisi Harga</div><table><tr><td>MA20</td><td>${rup(t.ma20)}</td></tr><tr><td>MA50</td><td>${rup(t.ma50)}</td></tr><tr><td>MA200</td><td>${rup(t.ma200)}</td></tr><tr><td>RSI 14</td><td>${t.rsi14?.toFixed(1)||'—'}</td></tr><tr><td>Return 1 Bulan</td><td class=${cl(t.return1m)}>${pct(t.return1m)}</td></tr><tr><td>Return 3 Bulan</td><td class=${cl(t.return3m)}>${pct(t.return3m)}</td></tr></table></section><section class="card half"><div class=section>Fundamental Utama</div><div class=raw><div><span>EPS TTM</span><b>${num(r.epsTTM)}</b></div><div><span>P/E Sekarang</span><b>${r.currentPE?.toFixed(2)||'—'}×</b></div><div><span>P/BV Sekarang</span><b>${r.currentPBV?.toFixed(2)||'—'}×</b></div><div><span>ROE</span><b>${pct(r.roe)}</b></div><div><span>BVPS</span><b>${num(r.bvps)}</b></div><div><span>Free Cash Flow</span><b>${num(r.fcf)}</b></div><div><span>FCF / Laba Bersih</span><b>${pct(q.cashConversion)}</b></div><div><span>Market Cap</span><b>${num(r.marketCap)}</b></div><div><span>Model Sektor</span><b>${p.sector||'Umum'}</b></div></div></section><section class="card full footer">WISS Fair Value Engine v3.1 · Estimasi, bukan target harga. Harga pasar diperbarui dari Yahoo Finance via yfinance; laporan fundamental berubah mengikuti publikasi emiten. Bobot valuasi disesuaikan menurut profil sektor/industri.</section>`}ticker.addEventListener('keydown',e=>{if(e.key==='Enter')go()});go();</script></body></html>
