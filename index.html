e=q;err.style.display='none';try{let x=await fetch('data/'+q+'.json?x='+Date.now(),{cache:'no-store'});if(!x.ok)throw Error('Data '+q+' belum tersedia atau sedang diproses.');D=await x.json();if(!D||!D.price)throw Error('Data '+q+' belum lengkap.');scenario='base';remember(q);render();loadCatalysts(q)}catch(e){D=null;head.innerHTML='';app.innerHTML=`<section class="card empty"><div class=section>${q} belum dapat dianalisis</div><div class=hint>${e.message}</div><div style="margin-top:16px"><a href="universe.html">← Cek status di Daftar Saham DES</a></div></section>`;err.textContent=e.message;err.style.display='block'}}function smet(x){let fv=D?.fairValue?.[x],p=D?.price;if(!fv||!p)return{fv:null,potential:null,premium:null,zone:'limited',status:'FV TERBATAS'};let prem=p/fv-1,zone=prem<=-.1?'discount':prem>=.1?'expensive':'fairprice';return{fv,potential:fv/p-1,premium:prem,zone,status:zone==='discount'?'MURAH':zone==='expensive'?'MAHAL':'WAJAR'}}function choose(x){scenario=x;render()}function render(){let d=D,f=d.fairValue||{},t=d.technical||{},r=d.raw||{},q=d.quality||{},p=d.companyProfile||{},s=smet(scenario),sn=scenario==='bear'?'Konservatif':scenario==='bull'?'Optimistis':'Base',agree=f.agreement==='HIGH'?'TINGGI':f.agreement==='MEDIUM'?'SEDANG':f.agreement==='LOW'?'RENDAH':'—',rawScore=Number(q.dataScore),score100=Number.isFinite(rawScore)?Math.max(0,Math.min(100,rawScore<=1?rawScore*100:rawScore)):0,scoreLabel=q.dataLabel||q.label||(score100>=80?'BAIK':score100>=60?'CUKUP':'TERBATAS'),scoreClass=score100>=80?'pos':score100>=60?'amber':'neg',hasFV=!!f.available,confidence=hasFV&&Number.isFinite(Number(q.valuationConfidence))?Math.round(Number(q.valuationConfidence)):null,trend=t.ma50?d.price/t.ma50-1:null,trendState=trend==null?'—':trend>=.05?'Bullish':trend<=-.05?'Bearish':'Netral',trendText=trend==null?'—':(trend>=0?'Di atas MA50 ':'Di bawah MA50 ')+pct(Math.abs(trend)),pin=s.premium==null?50:Math.max(2,Math.min(98,50+s.premium*70));head.innerHTML=`<div class= s=big>${agree}</div><div class=note>Selisih hasil ${pct(f.dispersion)}</div></section><section class="card kpi"><div class=lbl>Kualitas Analisis</div><div class="big ${scoreClass}">${scoreLabel}</div><div class=note>Skor data ${Math.round(score100)}/100 · ${valid} metode valid${independent?' · '+independent+' keluarga independen':''}</div><div class=note style="margin-top:4px">${confidence!=null?'Confidence valuasi '+confidence+'/100':'Confidence: belum dapat dinilai — bukti independen belum cukup'}</div><div class=meter><i style="width:${score100}%"></i></div></section><section class="card full" id=catalystCard><div class=section>Katalis & Keterbukaan IDX · 3 Tahun</div><div class=hint id=catalystBody>Memuat cache keterbukaan untuk ticker ini…</div></section><section class="card full"><div class=section>Model Valuasi Sesuai Sektor</div><div class=sectorbanner><b>${p.sector||p.sourceSector||'Umum'}${p.industry?' · '+p.industry:''}</b><div>${p.explanation||'Bobot metode disesuaikan dengan karakter sektor dan kualitas data.'}</div></div><table><thead><tr><th>Metode</th><th>Konservatif</th><th>Nilai Metode</th><th>Optimistis</th><th>Potensi</th><th>Bobot Final</th></tr></thead><tbody>${rows||'<tr><td colspan=6>Belum ada metode yang lolos validasi.</td></tr>'}</tbody></table></section><section class="card full"><div class=section>Zona Margin of Safety · Skenario ${sn}</div>${s.fv?`<div class=safeviz><div class=safetrack>${mosHtml}</div><div class=safecaption>Margin of safety berbasis estimasi valuasi. Bukan sinyal transaksi otomatis.</div></div>`:'<div class=hint>Zona belum ditampilkan karena metode valid belum mencukupi.</div>'}</section><section class="card half"><div class=section>Kondisi Harga</div><table><tbody><tr><td>MA20</td><td>${rup(t.ma20)}</td></tr><tr><td>MA50</td><td>${rup(t.ma50)}</td></tr><tr><td>MA200</td><td>${rup(t.ma200)}</td></tr><tr><td>RSI 14</td><td>${t.rsi14!=null?Number(t.rsi14).toFixed(1):'—'}</td></tr><tr><td>Return 1 Bulan</td><td class=${cl .publishedAt?new Date(e.publishedAt).toLocaleDateString('id-ID'):'—',cats=(e.categories||[]).join(' · '),link=e.sourceUrl?`<a href="${esc(e.sourceUrl)}" target="_blank" rel="noopener" style="color:#087c61;font-weight:800;text-decoration:none">Sumber IDX ↗</a>`:'';return `<div class=catevent><div class=catmeta>${esc(dt)}${cats?' · '+esc(cats):''}</div><div class=cattitle>${esc(e.title||'Keterbukaan IDX')}</div>${(e.causalLinks||[]).length?`<div class=hint>${esc((e.causalLinks||[]).join(' · '))}</div>`:''}${link?`<div class=catlink>${link}</div>`:''}</div>`};let cards=groups.map(([name,cats])=>{let items=ev.filter(e=>(e.categories||[]).some(c=>cats.includes(c)));if(!items.length)return'';return `<div class=catAction><div class=catActionHead><b>${name}</b><span>${items.length}</span></div>${items.slice(0,4).map(eventHtml).join('')}${items.length>4?`<div class=hint>+${items.length-4} keterbukaan lain dalam 3 tahun</div>`:''}</div>`}).join('');el.innerHTML=`<div class=catSummary><div><span class=lbl>Pengendali</span><b>${esc(ctrlText)}</b></div><div><span class=lbl>Disclosure 3Y</span><b>${ev.length}</b></div><div><span class=lbl>Status Sumber</span><b>${ev.length?'TERVERIFIKASI':'CACHE KOSONG'}</b></div></div><div class=catGrid>${cards||'<div class="catAction catEmpty"><b>Belum ada action terverifikasi di cache</b><div class=hint>Ini tidak berarti emiten tidak memiliki berita/keterbukaan.</div></div>'}</div><div class=hint style="margin-top:10px">Katalis memberi konteks sebab-akibat. Fair Value hanya berubah bila dampak fundamentalnya dapat diukur.</div>`}catch(e){el.innerHTML='<div class=catSummary><div><span class=lbl>Status Sumber</span><b>SEDANG DISINKRONKAN</b></div></div><div class="catAction catEmpty"><b>Data IDX sedang disinkronkan</b><div class=hint>Collector belum memiliki cache keterbukaan terverifikasi untuk ticker ini. Kondisi ini tidak berarti emiten tidak memiliki berita atau keterbukaan.</div></div>'}}
