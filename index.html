<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WISS Fair Value</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Inter,system-ui,-apple-system,Arial}.nav{background:#fff;border-bottom:1px solid #e4e9f1;position:sticky;top:0;z-index:5}.navin{max-width:1200px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}.logo{font-size:21px;font-weight:900;color:#12213d}.logo i{font-style:normal;color:#0aae83}.search{display:flex;gap:8px}.search input{width:190px;border:1px solid #dce3ed;background:#f8fafc;padding:11px 14px;border-radius:9px;font-size:15px;font-weight:700;text-transform:uppercase}.search input:focus{border-color:#0aae83;outline:none}button{background:#0aae83;color:#fff;border:0;border-radius:9px;padding:11px 17px;font-weight:800;cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:22px}.tickerhead{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:16px}.symbol{font-size:28px;font-weight:900}.company,.updated,.note,.scenarioHint{color:#8995a7;font-size:12px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:#fff;border:1px solid #e5eaf1;border-radius:13px;padding:18px;box-shadow:0 3px 15px rgba(28,43,70,.035)}.price{grid-column:span 4;color:#fff;border:0;transition:.25s}.price.discount{background:linear-gradient(135deg,#07865f,#18bd8c)}.price.fairprice{background:linear-gradient(135deg,#c98a08,#efbd35)}.price.expensive{background:linear-gradient(135deg,#cf3f50,#ef6875)}.price .lbl{color:rgba(255,255,255,.82)}.fair{grid-column:span 8}.kpi{grid-column:span 3}.full{grid-column:span 12}.half{grid-column:span 6}.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#8491a4;font-weight:800}.pricebig{font-size:42px;font-weight:900;margin:7px 0}.sub{font-size:13px}.fvrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.fv{padding:12px;background:#f6f8fb;border:1px solid transparent;border-radius:10px;cursor:pointer;text-align:left;color:#172033;transition:.18s}.fv:hover{transform:translateY(-1px)}.fv b{font-size:21px;display:block;margin-top:4px}.fv.active{border-color:#0aae83;box-shadow:0 0 0 2px rgba(10,174,131,.12)}.fv.active[data-scenario=base]{background:#e9fbf5}.fv.active[data-scenario=bear]{background:#eef4ff}.fv.active[data-scenario=bull]{background:#fff1f2}.fv.active b{color:#07946f}.big{font-size:27px;font-weight:900;margin-top:7px}.pos{color:#07946f}.neg{color:#e64b5d}.amber{color:#d58b00}.pill{display:inline-flex;padding:5px 9px;border-radius:7px;background:rgba(255,255,255,.92);color:#46566c;font-size:11px;font-weight:900;margin-top:9px}.section{font-size:14px;font-weight:900;margin-bottom:7px}.dot{width:8px;height:8px;border-radius:50%;background:#ffb020;display:inline-block;margin-right:6px}.meter{height:6px;background:#edf1f5;border-radius:9px;margin-top:10px;overflow:hidden}.meter i{display:block;height:100%;background:#0aae83}.raw{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.raw div{padding:11px;background:#f7f9fc;border-radius:9px}.raw span{font-size:10px;color:#8995a7;display:block}.raw b{font-size:14px;margin-top:4px;display:block}table{width:100%;border-collapse:collapse}th,td{padding:12px 8px;border-bottom:1px solid #edf0f4;text-align:right;font-size:13px}th{font-size:11px;color:#8592a5;text-transform:uppercase}th:first-child,td:first-child{text-align:left}.method{font-weight:750}.warn{font-size:10px;color:#d58b00;display:block;margin-top:2px}.band{height:9px;border-radius:10px;background:linear-gradient(90deg,#36c59c 0 35%,#f2c94c 35% 65%,#ef6b75 65%);position:relative;margin:15px 3px 7px}.pin{position:absolute;width:3px;height:17px;background:#172033;top:-4px;border-radius:3px}.bandlabels{display:flex;justify-content:space-between;font-size:10px;color:#8b97a7}.hist{margin-top:13px;padding-top:13px;border-top:1px solid #edf0f4}.histline{display:grid;grid-template-columns:105px 1fr 58px;align-items:center;gap:10px;margin:10px 0}.track{height:7px;background:linear-gradient(90deg,#bdeee0,#f4d56b,#f3a0a7);border-radius:8px;position:relative}.track i{position:absolute;width:3px;height:15px;background:#172033;top:-4px}.histname,.z{font-size:11px;font-weight:800}.z{text-align:right}.health,.mos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{padding:7px 10px;border-radius:8px;background:#f6f8fb;font-size:11px;font-weight:700}.warnchip{background:#fff7e3;color:#a86c00}.zoneword{font-size:24px;font-weight:900;margin-top:7px}.qualitygood{color:#07946f}.qualitymid{color:#d58b00}.error{color:#e64b5d;padding:12px 0}@media(max-width:760px){.navin{padding:12px 15px}.logo{font-size:18px}.search input{width:120px}.wrap{padding:15px}.price,.fair,.kpi,.half{grid-column:span 12}.tickerhead{align-items:start;flex-direction:column}.fvrow{grid-template-columns:repeat(3,1fr)}.fv{padding:10px}.fv b{font-size:16px}.pricebig{font-size:36px}.raw{grid-template-columns:repeat(2,1fr)}table{display:block;overflow-x:auto;white-space:nowrap}}</style></head><body><div class=nav><div class=navin><div class=logo>WISS <i>FAIR VALUE</i></div><div class=search><input id=ticker value=TOTL placeholder="Kode saham"><button onclick=go()>Analisa</button></div></div></div><main class=wrap><div id=err class=error></div><div id=head></div><div id=app class=grid></div></main><script>const rup=v=>v==null?'—':new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(v),pct=v=>v==null?'—':(v*100).toFixed(1)+'%',num=v=>v==null?'—':new Intl.NumberFormat('id-ID',{maximumFractionDigits:2,notation:'compact'}).format(v),cl=v=>v>=0?'pos':'neg';let currentData=null,scenario='base';async function go(){let q=ticker.value.trim().toUpperCase();err.textContent='';app.innerHTML='<div class="card full">Mengambil data valuasi…</div>';try{let x=await fetch('data/'+q+'.json?x='+Date.now());if(!x.ok)throw Error('Kode saham belum tersedia');currentData=await x.json();scenario='base';render(currentData)}catch(e){app.innerHTML='';err.textContent=e.message}}function smet(d,s){let fv=d.fairValue[s],price=d.price,potential=fv/price-1,premium=price/fv-1,zone=premium<=-.10?'discount':premium>=.10?'expensive':'fairprice';return{fv,potential,premium,zone,status:zone==='discount'?'MURAH':zone==='expensive'?'MAHAL':'WAJAR'}}function choose(s){scenario=s;render(currentData)}function render(d){let f=d.fairValue,t=d.technical||{},r=d.raw||{},q=d.quality||{},dc=d.dcfDiagnostics||{},s=smet(d,scenario),sn=scenario==='bear'?'Konservatif (Bear)':scenario==='bull'?'Optimistis (Bull)':'Harga Wajar (Base)';head.innerHTML=`<div class=tickerhead><div><div class=symbol>${d.ticker.replace('.JK','')}</div><div class=company>${d.name}</div></div><div class=updated>Data diperbarui ${new Date(d.asOf).toLocaleString('id-ID')} · Yahoo Finance</div></div>`;let methods=d.methods.map(m=>{let up=m[scenario]/d.price-1;return `<tr><td><span class=method>${m.name}</span>${m.warning?`<span class=warn>⚠ ${m.warning==='Terminal value high'?'Porsi nilai jangka panjang tinggi':m.warning}</span>`:''}</td><td>${rup(m.bear)}</td><td><b>${rup(m.base)}</b></td><td>${rup(m.bull)}</td><td class=${cl(up)}>${pct(up)}</td><td>${m.included?pct(m.normalizedWeight):'Tidak dipakai'}</td></tr>`}).join('');let pes=d.methods.filter(x=>x.name.includes('P/E')&&x.bands);let hist=pes.map(p=>{let z=p.bands.z||0,pos=Math.max(2,Math.min(98,50+z*16));return `<div class=histline><span class=histname>${p.name.includes('3Y')?'P/E 3 Tahun':'P/E 5 Tahun'}</span><div class=track><i style="left:${pos}%"></i></div><span class=z>${z.toFixed(2)}σ</span></div>`}).join('');let pe=pes[0],pin=Math.max(2,Math.min(98,50+s.premium*70)),agree=f.agreement==='HIGH'?'TINGGI':f.agreement==='MEDIUM'?'SEDANG':'RENDAH',qs=q.dataScore??Math.round((f.confidence||0)),ql=q.dataLabel||(qs>=80?'BAIK':qs>=60?'CUKUP':'TERBATAS'),qc=qs>=80?'qualitygood':qs>=60?'qualitymid':'neg',mos20=s.fv*.8,mos30=s.fv*.7;app.innerHTML=`<section class="card price ${s.zone}"><div class=lbl>Harga Sekarang · ${sn}</div><div class=pricebig>${rup(d.price)}</div><div class=sub>Patokan terpilih ${rup(s.fv)}</div><div class=pill>${s.status}</div></section><section class="card fair"><div class=section>Estimasi Harga Wajar</div><div class=scenarioHint>Pilih skenario untuk melihat potensi harga dan status valuasi.</div><div class=fvrow><button class="fv ${scenario==='bear'?'active':''}" data-scenario=bear onclick="choose('bear')"><span class=lbl>Konservatif (Bear)</span><b>${rup(f.bear)}</b></button><button class="fv ${scenario==='base'?'active':''}" data-scenario=base onclick="choose('base')"><span class=lbl>Harga Wajar (Base)</span><b>${rup(f.base)}</b></button><button class="fv ${scenario==='bull'?'active':''}" data-scenario=bull onclick="choose('bull')"><span class=lbl>Optimistis (Bull)</span><b>${rup(f.bull)}</b></button></div><div class=band><i class=pin style="left:${pin}%"></i></div><div class=bandlabels><span>Murah</span><span>Wajar</span><span>Mahal</span></div>${hist?`<div class=hist><div class=lbl>Posisi P/E Dibanding Historis</div>${hist}</div>`:''}</section><section class="card kpi"><div class=lbl>Potensi ke ${sn}</div><div class="big ${cl(s.potential)}">${pct(s.potential)}</div><div class=note>Dari ${rup(d.price)} menuju ${rup(s.fv)}</div></section><section class="card kpi"><div class=lbl>Status Harga</div><div class="zoneword ${s.zone==='discount'?'pos':s.zone==='expensive'?'neg':'amber'}">${s.status}</div><div class=note>${s.status==='MURAH'?'Harga ≥10% di bawah patokan':s.status==='MAHAL'?'Harga ≥10% di atas patokan':'Harga dalam ±10% patokan'}</div></section><section class="card kpi"><div class=lbl>Kecocokan Hasil</div><div class=big>${agree}</div><div class=note><i class=dot></i>${pct(f.dispersion)} selisih antar metode</div></section><section class="card kpi"><div class=lbl>Kelengkapan Data</div><div class="big ${qc}">${ql}</div><div class=note>${q.availableInputs??'—'}/${q.totalInputs??10} data utama tersedia</div><div class=meter><i style="width:${qs}%"></i></div></section><section class="card full"><div class=section>Area Harga Aman · ${sn}</div><div class=mos><span class=chip>Patokan ${rup(s.fv)}</span><span class=chip>Diskon 20%: <b>${rup(mos20)}</b></span><span class=chip>Diskon 30%: <b>${rup(mos30)}</b></span><span class=chip>Harga sekarang: <b>${rup(d.price)}</b></span></div></section><section class="card full"><div class=section>Perbandingan Metode · ${sn}</div><table><thead><tr><th>Metode</th><th>Konservatif</th><th>Harga Wajar</th><th>Optimistis</th><th>Potensi</th><th>Bobot</th></tr></thead><tbody>${methods}</tbody></table><div class=health><span class="chip ${dc.warning?'warnchip':''}">Porsi DCF jangka panjang: ${pct(dc.terminalValueShare)}${dc.warning?' ⚠':''}</span><span class=chip>Asumsi pertumbuhan: ${pct(r.growthNormalized)}</span><span class=chip>Cost of Equity: ${pct(r.costOfEquity)}</span><span class=chip>Pertumbuhan jangka panjang: ${pct(r.terminalGrowth)}</span></div></section><section class="card half"><div class=section>Kondisi Harga</div><table><tr><td>MA20</td><td>${rup(t.ma20)}</td></tr><tr><td>MA50</td><td>${rup(t.ma50)}</td></tr><tr><td>MA200</td><td>${rup(t.ma200)}</td></tr><tr><td>RSI 14</td><td>${t.rsi14?.toFixed(1)??'—'}</td></tr><tr><td>Return 1 Bulan</td><td class=${cl(t.return1m)}>${pct(t.return1m)}</td></tr><tr><td>Return 3 Bulan</td><td class=${cl(t.return3m)}>${pct(t.return3m)}</td></tr></table></section><section class="card half"><div class=section>Fundamental Utama</div><div class=raw><div><span>EPS TTM</span><b>${num(r.epsTTM)}</b></div><div><span>P/E Sekarang</span><b>${r.currentPE?.toFixed(2)??'—'}×</b></div><div><span>P/BV Sekarang</span><b>${r.currentPBV?.toFixed(2)??'—'}×</b></div><div><span>ROE</span><b>${pct(r.roe)}</b></div><div><span>BVPS</span><b>${num(r.bvps)}</b></div><div><span>Free Cash Flow</span><b>${num(r.fcf)}</b></div><div><span>FCF / Laba Bersih</span><b>${pct(q.cashConversion)}</b></div><div><span>Market Cap</span><b>${num(r.marketCap)}</b></div><div><span>Posisi P/E 3Y</span><b>${pe?.bands?.z?.toFixed(2)??'—'}σ</b></div></div></section><section class="card full note">WISS Fair Value v2.3 · Bagian atas memakai bahasa keputusan trader. Hijau = murah, emas = sekitar harga wajar, merah = mahal terhadap skenario yang dipilih. Estimasi harga wajar bukan target harga pasti.</section>`}go()</script></body></html>
