<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WISS Fair Value</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Inter,system-ui,-apple-system,Arial}.nav{background:#fff;border-bottom:1px solid #e4e9f1;position:sticky;top:0;z-index:5}.navin{max-width:1200px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}.logo{font-size:21px;font-weight:900;color:#12213d}.logo i{font-style:normal;color:#0aae83}.search{display:flex;gap:8px}.search input{width:190px;border:1px solid #dce3ed;background:#f8fafc;padding:11px 14px;border-radius:9px;font-size:15px;font-weight:700;text-transform:uppercase;outline:none}.search input:focus{border-color:#0aae83}button{background:#0aae83;color:#fff;border:0;border-radius:9px;padding:11px 17px;font-weight:800;cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:22px}.tickerhead{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:16px}.symbol{font-size:28px;font-weight:900}.company{color:#7a879a;font-size:13px;margin-top:3px}.updated{font-size:12px;color:#8995a7}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:#fff;border:1px solid #e5eaf1;border-radius:13px;padding:18px;box-shadow:0 3px 15px rgba(28,43,70,.035)}.price{grid-column:span 4;color:#fff;border:0;transition:background .25s ease}.price.discount{background:linear-gradient(135deg,#07865f,#18bd8c)}.price.fairprice{background:linear-gradient(135deg,#c98a08,#efbd35)}.price.expensive{background:linear-gradient(135deg,#cf3f50,#ef6875)}.price .lbl{color:rgba(255,255,255,.82)}.fair{grid-column:span 8}.kpi{grid-column:span 3}.full{grid-column:span 12}.half{grid-column:span 6}.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8491a4;font-weight:800}.pricebig{font-size:42px;font-weight:900;margin:7px 0}.sub{font-size:13px;opacity:.94}.fvrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.fv{padding:12px;background:#f6f8fb;border:1px solid transparent;border-radius:10px;cursor:pointer;text-align:left;color:#172033;transition:.18s}.fv:hover{transform:translateY(-1px);border-color:#cfd8e5}.fv b{font-size:21px;display:block;margin-top:4px}.fv.active{border-color:#0aae83;box-shadow:0 0 0 2px rgba(10,174,131,.12)}.fv.active[data-scenario=base]{background:#e9fbf5}.fv.active[data-scenario=bear]{background:#eef4ff}.fv.active[data-scenario=bull]{background:#fff1f2}.fv.active b{color:#07946f}.big{font-size:27px;font-weight:900;margin-top:7px}.pos{color:#07946f}.neg{color:#e64b5d}.amber{color:#d58b00}.pill{display:inline-flex;padding:5px 9px;border-radius:7px;background:rgba(255,255,255,.92);color:#46566c;font-size:11px;font-weight:900;margin-top:9px}.section{font-size:14px;font-weight:900;margin-bottom:10px}.scenarioHint{font-size:11px;color:#8a96a7;margin-top:-4px}.agreement{display:flex;align-items:center;gap:8px;margin-top:8px}.dot{width:8px;height:8px;border-radius:50%;background:#ffb020}table{width:100%;border-collapse:collapse}th,td{padding:12px 8px;border-bottom:1px solid #edf0f4;text-align:right;font-size:13px}th{font-size:11px;color:#8592a5;text-transform:uppercase}th:first-child,td:first-child{text-align:left}.method{font-weight:750}.warn{font-size:10px;color:#d58b00;display:block;margin-top:2px}.meter{height:6px;background:#edf1f5;border-radius:9px;margin-top:10px;overflow:hidden}.meter i{display:block;height:100%;background:#0aae83}.raw{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.raw div{padding:11px;background:#f7f9fc;border-radius:9px}.raw span{font-size:10px;color:#8995a7;display:block}.raw b{font-size:14px;margin-top:4px;display:block}.note{font-size:11px;color:#8a96a7}.error{color:#e64b5d;padding:12px 0}.band{height:9px;border-radius:10px;background:linear-gradient(90deg,#36c59c 0 35%,#f2c94c 35% 65%,#ef6b75 65%);position:relative;margin:15px 3px 7px}.pin{position:absolute;width:3px;height:17px;background:#172033;top:-4px;border-radius:3px;transition:left .25s}.bandlabels{display:flex;justify-content:space-between;font-size:10px;color:#8b97a7}.hist{margin-top:13px;padding-top:13px;border-top:1px solid #edf0f4}.histline{display:grid;grid-template-columns:100px 1fr 58px;align-items:center;gap:10px;margin:10px 0}.track{height:7px;background:linear-gradient(90deg,#bdeee0,#f4d56b,#f3a0a7);border-radius:8px;position:relative}.track i{position:absolute;width:3px;height:15px;background:#172033;top:-4px}.histname{font-size:11px;font-weight:800}.z{text-align:right;font-size:11px;font-weight:800}.health{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{padding:6px 9px;border-radius:8px;background:#f6f8fb;font-size:11px;font-weight:700}.chip.warnchip{background:#fff7e3;color:#a86c00}@media(max-width:760px){.navin{padding:12px 15px}.logo{font-size:18px}.search input{width:120px}.wrap{padding:15px}.price,.fair,.kpi,.half{grid-column:span 12}.tickerhead{align-items:start;flex-direction:column}.fvrow{grid-template-columns:repeat(3,1fr)}.fv{padding:10px}.fv b{font-size:16px}.pricebig{font-size:36px}.raw{grid-template-columns:repeat(2,1fr)}table{display:block;overflow-x:auto;white-space:nowrap}}</style></head><body><div class=nav><div class=navin><div class=logo>WISS <i>FAIR VALUE</i></div><div class=search><input id=ticker value=TOTL placeholder="Kode saham"><button onclick=go()>Analyze</button></div></div></div><main class=wrap><div id=err class=error></div><div id=head></div><div id=app class=grid></div></main><script>const rup=v=>v==null?'—':new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(v),pct=v=>v==null?'—':(v*100).toFixed(1)+'%',num=v=>v==null?'—':new Intl.NumberFormat('id-ID',{maximumFractionDigits:2,notation:'compact'}).format(v),cl=v=>v>=0?'pos':'neg';let currentData=null,scenario='base';async function go(){let q=ticker.value.trim().toUpperCase();err.textContent='';app.innerHTML='<div class="card full">Loading valuation data…</div>';try{let x=await fetch('data/'+q+'.json?x='+Date.now());if(!x.ok)throw Error('Ticker belum tersedia');currentData=await x.json();scenario='base';render(currentData)}catch(e){app.innerHTML='';err.textContent=e.message}}function scenarioMetrics(d,s){let fv=d.fairValue[s],price=d.price,potential=fv/price-1,premium=price/fv-1;let zone=premium<=-.10?'discount':premium>=.10?'expensive':'fairprice';let status=zone==='discount'?'DISCOUNT / UNDERVALUED':zone==='expensive'?'PREMIUM / EXPENSIVE':'FAIR VALUE ZONE';return{fv,potential,premium,zone,status}}function selectScenario(s){scenario=s;render(currentData)}function render(d){let f=d.fairValue,t=d.technical||{},r=d.raw||{},q=d.quality||{},dc=d.dcfDiagnostics||{},sm=scenarioMetrics(d,scenario);head.innerHTML=`<div class=tickerhead><div><div class=symbol>${d.ticker.replace('.JK','')}</div><div class=company>${d.name}</div></div><div class=updated>Updated ${new Date(d.asOf).toLocaleString('id-ID')} · Yahoo Finance</div></div>`;let methods=d.methods.map(m=>{let mv=m[scenario],up=mv/d.price-1;return `<tr><td><span class=method>${m.name}</span>${m.warning?`<span class=warn>⚠ ${m.warning}</span>`:''}</td><td>${rup(m.bear)}</td><td><b>${rup(m.base)}</b></td><td>${rup(m.bull)}</td><td class=${cl(up)}>${pct(up)}</td><td>${m.included?pct(m.normalizedWeight):'Excluded'}</td></tr>`}).join('');let pes=d.methods.filter(x=>x.name.includes('P/E')&&x.bands);let hist=pes.map(p=>{let z=p.bands.z||0,pos=Math.max(2,Math.min(98,50+z*16));return `<div class=histline><span class=histname>${p.name.replace('Historical ','')}</span><div class=track><i style="left:${pos}%"></i></div><span class=z>${z.toFixed(2)}σ</span></div>`}).join('');let pe=pes[0];let fairPin=Math.max(2,Math.min(98,50+sm.premium*70));let sn=scenario==='bear'?'Bear':scenario==='bull'?'Bull':'Base';app.innerHTML=`<section class="card price ${sm.zone}"><div class=lbl>Last Price · ${sn} Scenario</div><div class=pricebig>${rup(d.price)}</div><div class=sub>${sm.premium>=0?'Price premium vs selected FV':'Price discount vs selected FV'} ${pct(Math.abs(sm.premium))}</div><div class=pill>${sm.status}</div></section><section class="card fair"><div class=section>Interactive Fair Value Range</div><div class=scenarioHint>Tap Bear, Base Fair Value, atau Bull untuk mengganti skenario valuasi.</div><div class=fvrow><button class="fv ${scenario==='bear'?'active':''}" data-scenario=bear onclick="selectScenario('bear')"><span class=lbl>Bear</span><b>${rup(f.bear)}</b></button><button class="fv ${scenario==='base'?'active':''}" data-scenario=base onclick="selectScenario('base')"><span class=lbl>Base Fair Value</span><b>${rup(f.base)}</b></button><button class="fv ${scenario==='bull'?'active':''}" data-scenario=bull onclick="selectScenario('bull')"><span class=lbl>Bull</span><b>${rup(f.bull)}</b></button></div><div class=band><i class=pin style="left:${fairPin}%"></i></div><div class=bandlabels><span>Discount</span><span>Fair Value</span><span>Premium</span></div>${hist?`<div class=hist><div class=lbl>Historical P/E Position</div>${hist}</div>`:''}</section><section class="card kpi"><div class=lbl>Potential to ${sn} FV</div><div class="big ${cl(sm.potential)}">${pct(sm.potential)}</div><div class=note>${rup(sm.fv)} ÷ ${rup(d.price)} − 1</div></section><section class="card kpi"><div class=lbl>Price Premium / Discount</div><div class="big ${sm.premium<=0?'pos':'neg'}">${sm.premium>=0?'+':''}${pct(sm.premium)}</div><div class=note>${rup(d.price)} ÷ ${rup(sm.fv)} − 1</div></section><section class="card kpi"><div class=lbl>Model Agreement</div><div class=big>${f.agreement||'—'}</div><div class=agreement><i class=dot></i><span class=note>Dispersion ${pct(f.dispersion)}</span></div></section><section class="card kpi"><div class=lbl>Confidence</div><div class=big>${f.confidence}/100</div><div class=meter><i style="width:${f.confidence}%"></i></div></section><section class="card full"><div class=section>Valuation Models · ${sn} Scenario</div><table><thead><tr><th>Approach</th><th>Bear</th><th>Base</th><th>Bull</th><th>${sn} Potential</th><th>Composite Weight</th></tr></thead><tbody>${methods}</tbody></table><div class=health><span class="chip ${dc.warning?'warnchip':''}">DCF Terminal Value: ${pct(dc.terminalValueShare)}</span><span class=chip>Growth: ${pct(r.growthNormalized)}</span><span class=chip>Cost of Equity: ${pct(r.costOfEquity)}</span><span class=chip>Terminal Growth: ${pct(r.terminalGrowth)}</span></div></section><section class="card half"><div class=section>Market Context</div><table><tr><td>MA20</td><td>${rup(t.ma20)}</td></tr><tr><td>MA50</td><td>${rup(t.ma50)}</td></tr><tr><td>MA200</td><td>${rup(t.ma200)}</td></tr><tr><td>RSI 14</td><td>${t.rsi14?.toFixed(1)??'—'}</td></tr><tr><td>1 Month Return</td><td class=${cl(t.return1m)}>${pct(t.return1m)}</td></tr><tr><td>3 Month Return</td><td class=${cl(t.return3m)}>${pct(t.return3m)}</td></tr></table></section><section class="card half"><div class=section>Fundamental Snapshot</div><div class=raw><div><span>EPS TTM</span><b>${num(r.epsTTM)}</b></div><div><span>Current P/E</span><b>${r.currentPE?.toFixed(2)??'—'}×</b></div><div><span>Current P/BV</span><b>${r.currentPBV?.toFixed(2)??'—'}×</b></div><div><span>ROE</span><b>${pct(r.roe)}</b></div><div><span>BVPS</span><b>${num(r.bvps)}</b></div><div><span>Free Cash Flow</span><b>${num(r.fcf)}</b></div><div><span>FCF / Net Income</span><b>${pct(q.cashConversion)}</b></div><div><span>Market Cap</span><b>${num(r.marketCap)}</b></div><div><span>P/E Z-Score</span><b>${pe?.bands?.z?.toFixed(2)??'—'}σ</b></div></div></section><section class="card full note">WISS Fair Value Engine v2.2 · Bear/Base/Bull are interactive valuation scenarios. Price-card color uses the selected scenario: green when price is ≥10% below selected FV, gold within ±10%, and red when price is ≥10% above selected FV.</section>`}go()</script></body></html>
