name: Update Fair Value Data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'generate_data.py'
      - 'augment_models.py'
      - 'postprocess_qc.py'
      - 'des_universe.py'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: fair-value-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate core valuation data
        run: python generate_data.py
      - name: Add EV EBITDA, Graham and dividend models
        run: python augment_models.py
      - name: Reject extreme outliers and rebuild composites
        run: python postprocess_qc.py
      - name: Commit refreshed valuation data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Generated data belongs to this run. If main moved while calculation was
          # running, update the code/base first and then restore this run's data.
          mkdir -p /tmp/fv-data
          cp -a data/. /tmp/fv-data/
          git fetch origin main
          git reset --hard origin/main
          rm -rf data
          mkdir -p data
          cp -a /tmp/fv-data/. data/

          git add data/
          if git diff --cached --quiet; then
            echo "No valuation data changes to commit."
            exit 0
          fi
          git commit -m "data: refresh multimodel fair values with robust QC"

          # One retry is enough for a rare external main update. Generated data
          # is intentionally kept as the authoritative output of this run.
          if git push origin HEAD:main; then
            exit 0
          fi
          echo "Main moved during final push; retrying safely..."
          cp -a data/. /tmp/fv-data/
          git fetch origin main
          git reset --hard origin/main
          rm -rf data
          mkdir -p data
          cp -a /tmp/fv-data/. data/
          git add data/
          git commit -m "data: refresh multimodel fair values with robust QC"
          git push origin HEAD:main
