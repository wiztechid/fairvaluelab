name: Update Fair Value Data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'generate_data.py'
      - 'adaptive_pe.py'
      - 'augment_models.py'
      - 'quarterly_normalizer.py'
      - 'sector_models.py'
      - 'postprocess_qc.py'
      - 'validate_engine.py'
      - 'snapshot_backtest.py'
      - 'idx_catalyst.py'
      - 'data/idx_disclosures.json'
      - 'des_universe.py'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: fair-value-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate core valuation data
        run: python generate_data.py
      - name: Add adaptive historical PE valuation
        run: python adaptive_pe.py
      - name: Add EV EBITDA, Graham and dividend models
        run: python augment_models.py
      - name: Normalize quarterly growth and remove extreme outliers
        run: python quarterly_normalizer.py
      - name: Add sector-aware forward earnings and justified PBV models
        run: python sector_models.py
      - name: Reject extreme outliers, cap family dominance and rebuild composites
        run: python postprocess_qc.py
      - name: Validate all DES valuations before publication
        run: python validate_engine.py
      - name: Build verified IDX disclosure catalyst layer
        run: python idx_catalyst.py
      - name: Lock quarterly valuation snapshots and update target progress
        run: python snapshot_backtest.py
      - name: Commit refreshed valuation data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/fv-data
          cp -a data/. /tmp/fv-data/
          git fetch origin main
          git reset --hard origin/main
          rm -rf data && mkdir -p data
          cp -a /tmp/fv-data/. data/
          git add data/
          if git diff --cached --quiet; then echo "No valuation data changes to commit."; exit 0; fi
          git commit -m "data: refresh valuations, IDX catalysts and backtest progress"
          if git push origin HEAD:main; then exit 0; fi
          echo "Main moved during final push; retrying safely..."
          cp -a data/. /tmp/fv-data/
          git fetch origin main
          git reset --hard origin/main
          rm -rf data && mkdir -p data
          cp -a /tmp/fv-data/. data/
          git add data/
          git commit -m "data: refresh valuations, IDX catalysts and backtest progress"
          git push origin HEAD:main
