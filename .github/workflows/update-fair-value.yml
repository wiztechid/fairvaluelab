name: Update Fair Value Data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'generate_data.py'
      - 'requirements.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python generate_data.py
      - name: Commit refreshed valuation data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: refresh fair values"
          git push
