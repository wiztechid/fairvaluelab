name: Update Fair Value Data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'generate_data.py'
      - 'adaptive_pe.py'
      - 'augment_models.py'
      - 'quarterly_normalizer.py'
      - 'sector_models.py'
      - 'sector_waterfall.py'
      - 'family_consensus.py'
      - 'postprocess_qc.py'
      - 'indicative_fv.py'
      - 'validate_engine.py'
      - 'snapshot_backtest.py'
      - 'catalyst_snapshot.py'
      - 'collect_news_7d.py'
      - 'build_ticker_aliases.py'
      - 'catalyst_7d.py'
      - 'fv_timeline.py'
      - 'sector_mos.py'
      - 'golden_zone.py'
      - 'generate_data.py'
      - 'des_universe.py'
      - 'requirements.txt'
      - '.github/workflows/update-fair-value.yml'

permissions:
  contents: write

concurrency:
  group: fair-value-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate core valuation data
        run: python generate_data.py
      - name: Add adaptive historical PE valuation
        run: python adaptive_pe.py
      - name: Add EV EBITDA, Graham and dividend models
        run: python augment_models.py
      - name: Normalize quarterly growth and remove extreme outliers
        run: python quarterly_normalizer.py
      - name: Add sector-aware forward earnings and justified PBV models
        run: python sector_models.py
      - name: Add v3.19 sector valuation waterfall
        run: python sector_waterfall.py
      - name: Reject outliers, cap family dominance and rebuild composites
        run: python postprocess_qc.py
      - name: Publish indicative FV for limited independent evidence
        run: python indicative_fv.py
      - name: Build family consensus and forensic review gate
        run: python family_consensus.py
      - name: Validate all DES valuations before publication
        run: python validate_engine.py
      - name: Build ticker and company alias map
        run: python build_ticker_aliases.py
      - name: Collect rolling 20D public ticker news
        run: python collect_news_7d.py
      - name: Build deduplicated material 20D catalysts
        run: python catalyst_7d.py
      - name: Build top-10 margin of safety by DES sector
        run: python sector_mos.py
      - name: Build adaptive WISS Golden Zone from confirmed price swings
        run: python golden_zone.py
      - name: Lock quarterly valuation snapshots and update target progress
        run: python snapshot_backtest.py
      - name: Bind cached point-in-time catalysts to locked snapshots
        run: python catalyst_snapshot.py
      - name: Build FV timeline and quarter-over-quarter attribution
        run: python fv_timeline.py
      - name: Commit refreshed valuation data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/fv-data
          cp -a data/. /tmp/fv-data/
          git fetch origin main
          git reset --hard origin/main
          rm -rf data && mkdir -p data
          cp -a /tmp/fv-data/. data/
          git add data/
          if git diff --cached --quiet; then echo "No valuation data changes to commit."; exit 0; fi
          git commit -m "data: refresh FV timelines and backtest progress"
          if git push origin HEAD:main; then exit 0; fi
          echo "Main moved during final push; retrying safely..."
          cp -a data/. /tmp/fv-data/
          git fetch origin main
          git reset --hard origin/main
          rm -rf data && mkdir -p data
          cp -a /tmp/fv-data/. data/
          git add data/
          git commit -m "data: refresh FV timelines and backtest progress"
          git push origin HEAD:main
