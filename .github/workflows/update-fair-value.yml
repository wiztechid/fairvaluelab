name: Update Fair Value Data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'generate_data.py'
      - 'postprocess_qc.py'
      - 'des_universe.py'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: fair-value-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate valuation data
        run: python generate_data.py
      - name: Reject extreme outliers and rebuild composites
        run: python postprocess_qc.py
      - name: Commit refreshed valuation data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No valuation data changes to commit."
            exit 0
          fi
          git commit -m "data: refresh fair values with robust QC"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push conflicted; rebasing onto latest main (attempt $attempt/3)..."
            git pull --rebase origin main
          done
          echo "Unable to push refreshed valuation data after 3 attempts."
          exit 1
