name: Scanner Boundary Integration v1 Gate
on:
  push:
    paths:
      - 'scripts/scanner-boundary-integration-test-v1.js'
      - 'scripts/scanner-public-enrichment-boundary-v1.js'
      - 'scripts/scanner-contract-validator.js'
      - 'scripts/scanner-publication-gate.js'
      - 'contracts/private-public-scanner-seed-v1.pinned.json'
      - '.github/workflows/scanner-boundary-integration-v1-gate.yml'
  pull_request:
    paths:
      - 'scripts/scanner-boundary-integration-test-v1.js'
      - 'scripts/scanner-public-enrichment-boundary-v1.js'
      - 'scripts/scanner-contract-validator.js'
      - 'scripts/scanner-publication-gate.js'
      - 'contracts/private-public-scanner-seed-v1.pinned.json'
      - '.github/workflows/scanner-boundary-integration-v1-gate.yml'
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node scripts/scanner-boundary-integration-test-v1.js
