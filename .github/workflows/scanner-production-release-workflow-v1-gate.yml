name: Scanner Production Release Workflow v1 Gate
on:
  push:
    paths: ['scripts/scanner-production-release-preflight-v1.js','.github/workflows/scanner-production-release-v1.yml','.github/workflows/scanner-production-release-workflow-v1-gate.yml']
  pull_request:
    paths: ['scripts/scanner-production-release-preflight-v1.js','.github/workflows/scanner-production-release-v1.yml','.github/workflows/scanner-production-release-workflow-v1-gate.yml']
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/scanner-production-release-preflight-test-v1.js
