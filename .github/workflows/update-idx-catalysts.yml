name: Update IDX Catalysts

on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'collect_idx_disclosures.py'
      - 'idx_catalyst.py'
      - 'market_actors.py'
      - 'des_universe.py'
      - 'requirements.txt'
      - '.github/workflows/update-idx-catalysts.yml'

permissions:
  contents: write

concurrency:
  group: idx-catalyst-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect official IDX disclosures
        run: python collect_idx_disclosures.py
      - name: Build catalyst layer from verified disclosures
        run: python idx_catalyst.py
      - name: Build verified controller and broker actor layer
        run: python market_actors.py
      - name: Validate disclosure ingestion health
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/idx_disclosures.json')
          rows=json.loads(p.read_text()) if p.exists() else []
          if not isinstance(rows,list):
              raise SystemExit('idx_disclosures.json must be a list')
          print('IDX_DISCLOSURE_RECORDS',len(rows))
          if len(rows)==0:
              print('IDX source unavailable/blocked: preserving honest empty state; no fabricated catalyst/controller/broker data.')
          PY
      - name: Commit verified IDX actor data only when changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/idx_disclosures.json data/idx_collector_status.json data/catalysts/ data/market_actors/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "No IDX catalyst/actor data changes to commit."; exit 0; fi
          git commit -m "data: refresh verified IDX catalysts and market actors"
          git pull --rebase origin main
          git push origin HEAD:main
