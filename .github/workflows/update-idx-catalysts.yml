name: Update IDX Catalysts

on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'collect_idx_disclosures.py'
      - 'idx_catalyst.py'
      - 'filing_provenance.py'
      - 'filing_provenance_adversarial_test.py'
      - 'dual_source_filing_provenance.py'
      - 'dual_source_filing_provenance_adversarial_test.py'
      - 'idx_public_financial_report_adapter.py'
      - 'idx_public_financial_report_adapter_adversarial_test.py'
      - 'idx_authorized_data_reference_boundary.py'
      - 'idx_authorized_data_reference_boundary_adversarial_test.py'
      - 'idx_authorized_boundary_dormancy_adversarial_test.py'
      - 'quarterly_normalizer.py'
      - 'quarterly_normalizer_scope_adversarial_test.py'
      - 'valuation_document.py'
      - 'valuation_artifact_isolation_adversarial_test.py'
      - 'postprocess_qc.py'
      - 'snapshot_backtest.py'
      - 'market_actors.py'
      - 'des_universe.py'
      - 'requirements.txt'
      - '.github/workflows/update-idx-catalysts.yml'

permissions:
  contents: write

concurrency:
  group: idx-catalyst-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate filing provenance fail-closed contract
        run: python filing_provenance_adversarial_test.py
      - name: Validate dual-source filing provenance contract
        run: python dual_source_filing_provenance_adversarial_test.py
      - name: Validate public financial report evidence adapter
        run: python idx_public_financial_report_adapter_adversarial_test.py
      - name: Validate authorized IDX Data Reference boundary
        run: python idx_authorized_data_reference_boundary_adversarial_test.py
      - name: Validate authorized IDX boundary dormancy
        run: python idx_authorized_boundary_dormancy_adversarial_test.py
      - name: Validate quarterly normalizer artifact scope
        run: python quarterly_normalizer_scope_adversarial_test.py
      - name: Validate repo-wide valuation artifact isolation
        run: python valuation_artifact_isolation_adversarial_test.py
      - name: Collect official IDX disclosures
        run: python collect_idx_disclosures.py
      - name: Build catalyst layer from verified disclosures
        run: python idx_catalyst.py
      - name: Build verified controller and broker actor layer
        run: python market_actors.py
      - name: Validate market actor publication contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from des_universe import TICKERS
          root=Path('data/market_actors')
          summary=root/'summary.json'
          missing=[t for t in TICKERS if not (root/f'{t}.json').is_file()]
          if missing or not summary.is_file():
              raise SystemExit(f'market actor publication incomplete: missing={missing[:10]} summary={summary.is_file()}')
          s=json.loads(summary.read_text(encoding='utf-8'))
          if len(s.get('stocks') or []) != len(TICKERS):
              raise SystemExit('market actor summary/universe mismatch')
          for t in TICKERS:
              d=json.loads((root/f'{t}.json').read_text(encoding='utf-8'))
              ctrl=d.get('controller') or {}
              if ctrl.get('status')=='VERIFIED' and not ctrl.get('sourceUrl'):
                  raise SystemExit(f'{t}: VERIFIED controller without sourceUrl')
          print('MARKET_ACTOR_PUBLICATION_OK',len(TICKERS))
          PY
      - name: Validate disclosure ingestion health
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/idx_disclosures.json')
          rows=json.loads(p.read_text()) if p.exists() else []
          if not isinstance(rows,list):
              raise SystemExit('idx_disclosures.json must be a list')
          print('IDX_DISCLOSURE_RECORDS',len(rows))
          verified_filings=[r for r in rows if isinstance(r,dict) and r.get('documentType')=='FINANCIAL_STATEMENT' and r.get('financialQuarter') and r.get('verification')=='OFFICIAL_IDX_API']
          print('IDX_NORMALIZED_FINANCIAL_FILINGS',len(verified_filings))
          hp=Path('data/idx_collector_status.json')
          health=json.loads(hp.read_text()) if hp.exists() else {}
          allowed={'contractVersion','checkedAt','ok','source','historyDays','state','error','cachedRecords','transport','newRecords','tickers'}
          extra=set(health)-allowed
          if health.get('contractVersion')!='IDX_COLLECTOR_STATUS_V1' or extra:
              raise SystemExit(f'collector health contract violation: extra={sorted(extra)}')
          print('IDX_COLLECTOR_STATE',health.get('state'))
          if len(rows)==0:
              print('IDX source unavailable/blocked: preserving honest empty state; no fabricated catalyst/controller/broker data.')
          PY
      - name: Commit verified IDX actor data only when changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/idx_disclosures.json data/idx_collector_status.json data/catalysts/ 2>/dev/null || true
          git add -f data/market_actors/
          if git diff --cached --quiet; then echo "No IDX catalyst/actor data changes to commit."; exit 0; fi
          git commit -m "data: refresh verified IDX catalysts and market actors"
          # Generated-but-unpublished working-tree files must not block rebasing the verified staged payload.
          git status --porcelain
          git stash push --include-untracked --keep-index -m "ci-generated-unpublished" || true
          git pull --rebase origin main
          git push origin HEAD:main
