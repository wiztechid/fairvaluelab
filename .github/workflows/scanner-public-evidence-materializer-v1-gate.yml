name: Scanner Public Evidence Materializer v1 Gate
on:
  push:
    paths: ['scripts/scanner-public-evidence-materializer-v1.js','scripts/scanner-public-evidence-materializer-test-v1.js','.github/workflows/scanner-public-evidence-materializer-v1-gate.yml']
  pull_request:
    paths: ['scripts/scanner-public-evidence-materializer-v1.js','scripts/scanner-public-evidence-materializer-test-v1.js','.github/workflows/scanner-public-evidence-materializer-v1-gate.yml']
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/scanner-public-evidence-materializer-test-v1.js
      - run: node scripts/scanner-public-enrichment-boundary-adversarial-test-v1.js
