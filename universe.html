<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WISS · Daftar Saham DES</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fb;color:#172033;font-family:Inter,system-ui,Arial}.nav{background:#fff;border-bottom:1px solid #e5eaf1;position:sticky;top:0}.navin,.wrap{max-width:1180px;margin:auto;padding:16px 22px}.navin{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:20px}.logo i{font-style:normal;color:#08a982}a{color:#087c61;text-decoration:none;font-weight:800}.hero{display:flex;gap:12px;justify-content:space-between;align-items:end;margin:12px 0 18px}.hero h1{margin:0 0 5px;font-size:28px}.muted{color:#8491a4;font-size:12px}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls input,.controls select{background:#fff;border:1px solid #dce3ed;border-radius:10px;padding:11px 13px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.card{background:#fff;border:1px solid #e5eaf1;border-radius:13px;padding:15px}.lbl{font-size:10px;color:#8491a4;text-transform:uppercase;font-weight:900}.big{font-size:25px;font-weight:900;margin-top:5px}.ok{color:#07946f}.bad{color:#e44e61}.amber{color:#ce8c09}.blue{color:#2563eb}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e5eaf1;border-radius:13px;overflow:hidden}th,td{padding:12px 10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:12px}th{font-size:10px;text-transform:uppercase;color:#8491a4}.pill{display:inline-block;padding:5px 8px;border-radius:8px;background:#eef3f7;font-weight:800}.pill.ok{background:#e9f9f4}.pill.bad{background:#fff0f2}.pill.amber{background:#fff8e7}.pill.blue{background:#eff6ff}@media(max-width:700px){.navin,.wrap{padding:14px}.hero{display:block}.controls{margin-top:12px}.stats{grid-template-columns:repeat(2,1fr)}table{display:block;overflow-x:auto;white-space:nowrap}}</style></head><body><div class=nav><div class=navin><div class=logo>WISS <i>FAIR VALUE</i></div><a href="./">← Fair Value Lab</a></div></div><main class=wrap><div class=hero><div><h1>Daftar Saham DES</h1><div class=muted id=source>Memuat universe…</div></div><div class=controls><input id=q placeholder="Cari ticker / sektor"><select id=sector><option value="">Semua sektor</option></select><select id=statusFilter><option value="">Semua status</option><option value=ready>SIAP</option><option value=review>REVIEW</option><option value=indicative>FV INDIKATIF</option><option value=limited>FV TERBATAS</option><option value=error>ERROR</option></select></div></div><div class=stats><div class=card><div class=lbl>Total DES</div><div class=big id=requested>—</div></div><div class=card><div class=lbl>Terproses</div><div class="big ok" id=success>—</div></div><div class=card><div class=lbl>FV valid</div><div class="big ok" id=valid>—</div></div><div class=card><div class=lbl>Benar-benar error</div><div class="big bad" id=failed>—</div></div></div><table><thead><tr><th>Ticker</th><th>Sektor DES</th><th>Profil Valuasi</th><th>Status</th><th>Metode Valid</th><th>Harga</th><th></th></tr></thead><tbody id=rows></tbody></table></main><script>let S=null,all=[];const $=id=>document.getElementById(id),qEl=$('q'),sectorEl=$('sector'),statusEl=$('statusFilter'),rowsEl=$('rows'),sourceEl=$('source'),requestedEl=$('requested'),successEl=$('success'),validEl=$('valid'),failedEl=$('failed');const rp=v=>v==null?'—':new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(v);const key=t=>String(t||'').replace(/\.JK$/i,'').trim().toUpperCase();function qcStatus(x){let raw=String(x.analysisStatus||x.status||'').trim().toUpperCase();if(raw==='SIAP'||raw==='READY')return'ready';if(raw==='REVIEW')return'review';if(raw==='INDIKATIF'||raw==='INDICATIVE')return'indicative';if(raw==='TERBATAS'||raw==='FV TERBATAS'||raw==='LIMITED')return'limited';if(raw==='ERROR'||raw==='GAGAL_FETCH'||raw==='GAGAL DIPROSES')return'error';if(x.indicative===true)return'indicative';if(x.available===false)return'limited';return x.available===true?'ready':'limited'}function statusMeta(st){return st==='ready'?['SIAP','ok']:st==='review'?['REVIEW','amber']:st==='indicative'?['FV INDIKATIF','blue']:st==='limited'?['FV TERBATAS','amber']:['ERROR','bad']}async function load(){let r=await fetch('data/summary.json?x='+Date.now(),{cache:'no-cache'});if(!r.ok)throw Error('HTTP '+r.status);S=await r.json();const byTicker=new Map();(S.errors||[]).forEach(x=>{let k=key(x.ticker);if(k)byTicker.set(k,{...x,ticker:k,valuationProfile:'—',_status:'error'})});(S.stocks||[]).forEach(x=>{let k=key(x.ticker);if(!k)return;byTicker.set(k,{...x,ticker:k,_status:qcStatus(x)})});all=[...byTicker.values()].sort((a,b)=>a.ticker.localeCompare(b.ticker));let good=all.filter(x=>x._status!=='error'),bad=all.filter(x=>x._status==='error');requestedEl.textContent=S.requested||all.length;successEl.textContent=good.length;validEl.textContent=good.filter(x=>x._status==='ready'||x._status==='review').length;failedEl.textContent=bad.length;sourceEl.textContent=(S.universeSource||'DES')+' · '+all.length+' ticker unik · Update '+new Date(S.updatedAt).toLocaleString('id-ID');[...new Set(all.map(x=>x.sector).filter(Boolean))].sort().forEach(x=>sectorEl.insertAdjacentHTML('beforeend',`<option>${x}</option>`));draw()}function draw(){let z=qEl.value.trim().toUpperCase(),sec=sectorEl.value,st=statusEl.value;let a=all.filter(x=>(!z||(x.ticker+' '+(x.sector||'')+' '+(x.valuationProfile||'')).toUpperCase().includes(z))&&(!sec||x.sector===sec)&&(!st||x._status===st));rowsEl.innerHTML=a.map(x=>{let [label,cls]=statusMeta(x._status);return `<tr><td><b>${x.ticker}</b></td><td>${x.sector||'—'}</td><td>${x.valuationProfile||'—'}</td><td><span class="pill ${cls}">${label}</span></td><td>${x.validMethods??'—'}</td><td>${rp(x.price)}</td><td>${x._status==='error'?`<span title="${String(x.error||'').replace(/"/g,'&quot;')}">Detail</span>`:`<a href="./?ticker=${x.ticker}">Analisa →</a>`}</td></tr>`}).join('')||'<tr><td colspan=7>Tidak ada data yang cocok.</td></tr>'}qEl.addEventListener('input',draw);sectorEl.addEventListener('change',draw);statusEl.addEventListener('change',draw);load().catch(e=>{sourceEl.textContent='Gagal memuat summary: '+e.message})</script></body></html>
