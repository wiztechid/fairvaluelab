<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WISS · Daftar Saham DES</title><meta name="description" content="Daftar saham dalam universe DES CekValuasi beserta sektor, status evidence, metode valid, harga, dan referensi valuasi."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://cekvaluasi.com/universe.html"><style>:root{--paper:#f4f3ed;--ink:#102a2b;--muted:#60706d;--emerald:#087b61;--signal:#17a779;--lime:#d9ed78;--rule:#cbd3cc;--white:#fff;--red:#a63f49;--amber:#806200}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.nav{background:rgba(244,243,237,.96);border-bottom:1px solid var(--ink);position:sticky;top:0;z-index:5}.navin,.wrap{max-width:1180px;margin:auto;padding:16px 24px}.navin{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:18px;letter-spacing:-.6px}.logo i,a{font-style:normal;color:var(--signal)}a{text-decoration:none;font-weight:800}.nav a{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);border-bottom:2px solid var(--signal);padding-bottom:4px}.hero{display:flex;gap:20px;justify-content:space-between;align-items:end;margin:34px 0 28px;padding-bottom:24px;border-bottom:1px solid var(--ink)}.hero h1{margin:0 0 8px;font-size:clamp(34px,5vw,54px);letter-spacing:-2px;line-height:1}.muted{color:var(--muted);font-size:12px}.controls{display:flex;gap:10px;flex-wrap:wrap}.controls input,.controls select{background:rgba(255,255,255,.4);border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:11px 8px;font-weight:700;color:var(--ink)}.controls input:focus,.controls select:focus{outline:0;border-bottom:3px solid var(--signal)}.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:0;margin-bottom:26px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}.card{background:transparent;border:0;border-right:1px solid var(--rule);border-radius:0;padding:14px}.stat{cursor:pointer;text-align:left}.stat:last-child{border-right:0}.stat.active{background:var(--lime);box-shadow:none}.lbl{font:800 9px ui-monospace,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.big{font-size:23px;font-weight:900;margin-top:5px}.ok{color:var(--emerald)}.bad{color:var(--red)}.amber{color:var(--amber)}.blue,.purple,.gray{color:var(--muted)}table{width:100%;border-collapse:collapse;background:transparent;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}th,td{padding:12px 10px;border-bottom:1px solid var(--rule);text-align:left;font-size:12px}th{font:800 9px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.pill{display:inline-block;padding:4px 7px;border-radius:0;border:1px solid var(--rule);background:transparent;font-weight:800}.pill.ok,.pill.bad,.pill.amber,.pill.blue,.pill.purple,.pill.gray{background:transparent}@media(max-width:900px){.stats{grid-template-columns:repeat(4,1fr)}.stat{border-bottom:1px solid var(--rule)}}@media(max-width:700px){.navin,.wrap{padding:14px 16px}.hero{display:block;margin-top:26px}.controls{margin-top:18px}.stats{grid-template-columns:repeat(2,1fr)}table{display:block;overflow-x:auto;white-space:nowrap}}
/* Cosmetic QC v1.3 — behavior/data untouched */
html{scroll-behavior:smooth}.navin{min-height:64px;padding-top:10px;padding-bottom:10px}.hero{gap:28px}.hero>div:first-child{min-width:240px}.controls input,.controls select{min-height:44px;font-size:12px}.controls input{min-width:190px}.stat{min-height:76px}.stat:focus-visible,.controls input:focus-visible,.controls select:focus-visible,a:focus-visible{outline:2px solid var(--signal);outline-offset:3px}tbody tr:hover{background:rgba(255,255,255,.34)}td:last-child a{display:inline-flex;align-items:center;min-height:34px}.pill{line-height:1.25}@media(max-width:700px){.navin{min-height:58px}.hero{margin-bottom:22px}.controls{display:grid;grid-template-columns:1fr 1fr;width:100%}.controls input{grid-column:1/-1;width:100%}.controls select{width:100%;min-width:0}.stats{margin-bottom:20px}.stat{min-height:70px;padding:12px 10px}table{padding-bottom:6px}}@media(max-width:420px){.controls{grid-template-columns:1fr}.controls input{grid-column:auto}.stats{grid-template-columns:1fr 1fr}.big{font-size:21px}}</style></head><body><div class=nav><div class=navin><div class=logo>WISS <i>FAIR VALUE</i></div><a href="./">← Fair Value Lab</a></div></div><main class=wrap><div class=hero><div><h1>Daftar Saham DES</h1><div class=muted id=source>Memuat universe…</div></div><div class=controls><input id=q placeholder="Cari ticker / sektor"><select id=sector><option value="">Semua sektor</option></select><select id=statusFilter><option value="">Semua status</option><option value=ready>SIAP</option><option value=review>REVIEW</option><option value=indicative>FV INDIKATIF</option><option value=reference>REFERENSI NILAI</option><option value=unvalued>BELUM DINILAI</option><option value=error>ERROR</option></select></div></div><div class=stats><button class="card stat active" data-st=""><div class=lbl>Total DES</div><div class=big id=cTotal>—</div></button><button class="card stat" data-st=ready><div class=lbl>SIAP</div><div class="big ok" id=cReady>—</div></button><button class="card stat" data-st=review><div class=lbl>REVIEW</div><div class="big amber" id=cReview>—</div></button><button class="card stat" data-st=indicative><div class=lbl>FV Indikatif</div><div class="big blue" id=cIndicative>—</div></button><button class="card stat" data-st=reference><div class=lbl>Referensi Nilai</div><div class="big purple" id=cReference>—</div></button><button class="card stat" data-st=unvalued><div class=lbl>Belum Dinilai</div><div class="big gray" id=cUnvalued>—</div></button><button class="card stat" data-st=error><div class=lbl>Error</div><div class="big bad" id=cError>—</div></button></div><table><thead><tr><th>Ticker</th><th>Sektor DES</th><th>Profil Valuasi</th><th>Status</th><th>Metode Valid</th><th>Harga</th><th>Nilai Base/Referensi</th><th></th></tr></thead><tbody id=rows></tbody></table></main><script>let S=null,all=[];const $=id=>document.getElementById(id),qEl=$('q'),sectorEl=$('sector'),statusEl=$('statusFilter'),rowsEl=$('rows'),sourceEl=$('source');const rp=v=>v==null||!isFinite(v)?'—':new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(v),key=t=>String(t||'').replace(/\.JK$/i,'').trim().toUpperCase();function qcStatus(x){let r=String(x.status||x.analysisStatus||'').trim().toUpperCase();if(r==='SIAP'||r==='READY')return'ready';if(r==='REVIEW')return'review';if(r==='INDIKATIF'||x.indicative===true)return'indicative';if(r==='REFERENSI'||x.referenceOnly===true)return'reference';if(r==='BELUM_DINILAI'||r==='TERBATAS'||r==='FV TERBATAS')return'unvalued';if(r==='ERROR'||r==='GAGAL_FETCH')return'error';return x.available===true?'ready':'unvalued'}function meta(s){return s==='ready'?['SIAP','ok']:s==='review'?['REVIEW','amber']:s==='indicative'?['FV INDIKATIF','blue']:s==='reference'?['REFERENSI NILAI','purple']:s==='unvalued'?['BELUM DINILAI','gray']:['ERROR','bad']}function count(s){return all.filter(x=>!s||x._status===s).length}function cards(){cTotal.textContent=all.length;cReady.textContent=count('ready');cReview.textContent=count('review');cIndicative.textContent=count('indicative');cReference.textContent=count('reference');cUnvalued.textContent=count('unvalued');cError.textContent=count('error');document.querySelectorAll('.stat').forEach(b=>b.classList.toggle('active',b.dataset.st===statusEl.value))}async function load(){let r=await fetch('data/summary.json?x='+Date.now(),{cache:'no-cache'});if(!r.ok)throw Error('HTTP '+r.status);S=await r.json();let map=new Map();(S.errors||[]).forEach(x=>{let k=key(x.ticker);if(k)map.set(k,{...x,ticker:k,valuationProfile:'—',_status:'error'})});(S.stocks||[]).forEach(x=>{let k=key(x.ticker);if(k)map.set(k,{...x,ticker:k,_status:qcStatus(x)})});all=[...map.values()].sort((a,b)=>a.ticker.localeCompare(b.ticker));sourceEl.textContent=(S.universeSource||'DES')+' · '+all.length+' ticker unik · Update '+new Date(S.updatedAt).toLocaleString('id-ID');[...new Set(all.map(x=>x.sector).filter(Boolean))].sort().forEach(x=>sectorEl.insertAdjacentHTML('beforeend',`<option>${x}</option>`));cards();draw()}function draw(){let z=qEl.value.trim().toUpperCase(),sec=sectorEl.value,st=statusEl.value,a=all.filter(x=>(!z||(x.ticker+' '+(x.sector||'')+' '+(x.valuationProfile||'')).toUpperCase().includes(z))&&(!sec||x.sector===sec)&&(!st||x._status===st));rowsEl.innerHTML=a.map(x=>{let [lab,cls]=meta(x._status),v=(x._status==='ready'||x._status==='review'||x._status==='indicative'||x._status==='reference')?rp(x.base):'—';return `<tr><td><b>${x.ticker}</b></td><td>${x.sector||'—'}</td><td>${x.valuationProfile||'—'}</td><td><span class="pill ${cls}">${lab}</span></td><td>${x.validMethods??'—'}</td><td>${rp(x.price)}</td><td>${v}</td><td>${x._status==='error'?`<span title="${String(x.error||'').replace(/"/g,'&quot;')}">Detail</span>`:`<a href="./?ticker=${x.ticker}">Analisa →</a>`}</td></tr>`}).join('')||'<tr><td colspan=8>Tidak ada data yang cocok.</td></tr>';cards()}qEl.addEventListener('input',draw);sectorEl.addEventListener('change',draw);statusEl.addEventListener('change',draw);document.querySelectorAll('.stat').forEach(b=>b.addEventListener('click',()=>{statusEl.value=b.dataset.st;draw()}));load().catch(e=>sourceEl.textContent='Gagal memuat summary: '+e.message)</script></body></html>
