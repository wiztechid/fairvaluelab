<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WISS · Daftar Saham DES</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fb;color:#172033;font-family:Inter,system-ui,Arial}.nav{background:#fff;border-bottom:1px solid #e5eaf1;position:sticky;top:0;z-index:5}.navin,.wrap{max-width:1180px;margin:auto;padding:16px 22px}.navin{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:20px}.logo i,a{font-style:normal;color:#08a982}a{text-decoration:none;font-weight:800}.hero{display:flex;gap:12px;justify-content:space-between;align-items:end;margin:12px 0 18px}.hero h1{margin:0 0 5px;font-size:28px}.muted{color:#8491a4;font-size:12px}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls input,.controls select{background:#fff;border:1px solid #dce3ed;border-radius:10px;padding:11px 13px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin-bottom:14px}.card{background:#fff;border:1px solid #e5eaf1;border-radius:13px;padding:13px}.stat{cursor:pointer;text-align:left}.stat.active{border-color:#08a982;box-shadow:0 0 0 2px #08a98218}.lbl{font-size:9px;color:#8491a4;text-transform:uppercase;font-weight:900}.big{font-size:23px;font-weight:900;margin-top:5px}.ok{color:#07946f}.bad{color:#e44e61}.amber{color:#ce8c09}.blue{color:#2563eb}.purple{color:#7c3aed}.gray{color:#64748b}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e5eaf1;border-radius:13px;overflow:hidden}th,td{padding:12px 10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:12px}th{font-size:10px;text-transform:uppercase;color:#8491a4}.pill{display:inline-block;padding:5px 8px;border-radius:8px;background:#eef3f7;font-weight:800}.pill.ok{background:#e9f9f4}.pill.bad{background:#fff0f2}.pill.amber{background:#fff8e7}.pill.blue{background:#eff6ff}.pill.purple{background:#f5f3ff}.pill.gray{background:#f1f5f9}@media(max-width:900px){.stats{grid-template-columns:repeat(4,1fr)}}@media(max-width:700px){.navin,.wrap{padding:14px}.hero{display:block}.controls{margin-top:12px}.stats{grid-template-columns:repeat(2,1fr)}table{display:block;overflow-x:auto;white-space:nowrap}}</style></head><body><div class=nav><div class=navin><div class=logo>WISS <i>FAIR VALUE</i></div><a href="./">← Fair Value Lab</a></div></div><main class=wrap><div class=hero><div><h1>Daftar Saham DES</h1><div class=muted id=source>Memuat universe…</div></div><div class=controls><input id=q placeholder="Cari ticker / sektor"><select id=sector><option value="">Semua sektor</option></select><select id=statusFilter><option value="">Semua status</option><option value=ready>SIAP</option><option value=review>REVIEW</option><option value=indicative>FV INDIKATIF</option><option value=reference>REFERENSI NILAI</option><option value=unvalued>BELUM DINILAI</option><option value=error>ERROR</option></select></div></div><div class=stats><button class="card stat active" data-st=""><div class=lbl>Total DES</div><div class=big id=cTotal>—</div></button><button class="card stat" data-st=ready><div class=lbl>SIAP</div><div class="big ok" id=cReady>—</div></button><button class="card stat" data-st=review><div class=lbl>REVIEW</div><div class="big amber" id=cReview>—</div></button><button class="card stat" data-st=indicative><div class=lbl>FV Indikatif</div><div class="big blue" id=cIndicative>—</div></button><button class="card stat" data-st=reference><div class=lbl>Referensi Nilai</div><div class="big purple" id=cReference>—</div></button><button class="card stat" data-st=unvalued><div class=lbl>Belum Dinilai</div><div class="big gray" id=cUnvalued>—</div></button><button class="card stat" data-st=error><div class=lbl>Error</div><div class="big bad" id=cError>—</div></button></div><table><thead><tr><th>Ticker</th><th>Sektor DES</th><th>Profil Valuasi</th><th>Status</th><th>Metode Valid</th><th>Harga</th><th>Nilai Base/Referensi</th><th></th></tr></thead><tbody id=rows></tbody></table></main><script>let S=null,all=[];const $=id=>document.getElementById(id),qEl=$('q'),sectorEl=$('sector'),statusEl=$('statusFilter'),rowsEl=$('rows'),sourceEl=$('source');const rp=v=>v==null||!isFinite(v)?'—':new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(v),key=t=>String(t||'').replace(/\.JK$/i,'').trim().toUpperCase();function qcStatus(x){let r=String(x.status||x.analysisStatus||'').trim().toUpperCase();if(r==='SIAP'||r==='READY')return'ready';if(r==='REVIEW')return'review';if(r==='INDIKATIF'||x.indicative===true)return'indicative';if(r==='REFERENSI'||x.referenceOnly===true)return'reference';if(r==='BELUM_DINILAI'||r==='TERBATAS'||r==='FV TERBATAS')return'unvalued';if(r==='ERROR'||r==='GAGAL_FETCH')return'error';return x.available===true?'ready':'unvalued'}function meta(s){return s==='ready'?['SIAP','ok']:s==='review'?['REVIEW','amber']:s==='indicative'?['FV INDIKATIF','blue']:s==='reference'?['REFERENSI NILAI','purple']:s==='unvalued'?['BELUM DINILAI','gray']:['ERROR','bad']}function count(s){return all.filter(x=>!s||x._status===s).length}function cards(){cTotal.textContent=all.length;cReady.textContent=count('ready');cReview.textContent=count('review');cIndicative.textContent=count('indicative');cReference.textContent=count('reference');cUnvalued.textContent=count('unvalued');cError.textContent=count('error');document.querySelectorAll('.stat').forEach(b=>b.classList.toggle('active',b.dataset.st===statusEl.value))}async function load(){let r=await fetch('data/summary.json?x='+Date.now(),{cache:'no-cache'});if(!r.ok)throw Error('HTTP '+r.status);S=await r.json();let map=new Map();(S.errors||[]).forEach(x=>{let k=key(x.ticker);if(k)map.set(k,{...x,ticker:k,valuationProfile:'—',_status:'error'})});(S.stocks||[]).forEach(x=>{let k=key(x.ticker);if(k)map.set(k,{...x,ticker:k,_status:qcStatus(x)})});all=[...map.values()].sort((a,b)=>a.ticker.localeCompare(b.ticker));sourceEl.textContent=(S.universeSource||'DES')+' · '+all.length+' ticker unik · Update '+new Date(S.updatedAt).toLocaleString('id-ID');[...new Set(all.map(x=>x.sector).filter(Boolean))].sort().forEach(x=>sectorEl.insertAdjacentHTML('beforeend',`<option>${x}</option>`));cards();draw()}function draw(){let z=qEl.value.trim().toUpperCase(),sec=sectorEl.value,st=statusEl.value,a=all.filter(x=>(!z||(x.ticker+' '+(x.sector||'')+' '+(x.valuationProfile||'')).toUpperCase().includes(z))&&(!sec||x.sector===sec)&&(!st||x._status===st));rowsEl.innerHTML=a.map(x=>{let [lab,cls]=meta(x._status),v=(x._status==='ready'||x._status==='review'||x._status==='indicative'||x._status==='reference')?rp(x.base):'—';return `<tr><td><b>${x.ticker}</b></td><td>${x.sector||'—'}</td><td>${x.valuationProfile||'—'}</td><td><span class="pill ${cls}">${lab}</span></td><td>${x.validMethods??'—'}</td><td>${rp(x.price)}</td><td>${v}</td><td>${x._status==='error'?`<span title="${String(x.error||'').replace(/"/g,'&quot;')}">Detail</span>`:`<a href="./?ticker=${x.ticker}">Analisa →</a>`}</td></tr>`}).join('')||'<tr><td colspan=8>Tidak ada data yang cocok.</td></tr>';cards()}qEl.addEventListener('input',draw);sectorEl.addEventListener('change',draw);statusEl.addEventListener('change',draw);document.querySelectorAll('.stat').forEach(b=>b.addEventListener('click',()=>{statusEl.value=b.dataset.st;draw()}));load().catch(e=>sourceEl.textContent='Gagal memuat summary: '+e.message)</script></body></html>
